[project]
name = "provetid"
version = "0.1.0"
description = "Prøvetid: tests a shop's AI employee against fake customers and real Norwegian scams."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "httpx",
    "pydantic>=2",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["provetid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
